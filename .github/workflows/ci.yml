name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run go vet
        run: |
          go vet ./...

      - name: Run unit tests
        run: |
          go test -v -race ./...

  build-check:
    name: Build & Verify Archive
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build and Package
        run: |
          make package VERSION=0.1.1

      - name: Verify Package Layout
        run: |
          make check VERSION=0.1.1

  build-cross:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: so
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: dll
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build native plugin
        shell: bash
        run: |
          go build -buildmode=c-shared -o "cpa-live-voice.${{ matrix.ext }}" .
          rm -f cpa-live-voice.h
